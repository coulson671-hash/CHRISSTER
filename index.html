<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geekster</title>

    <!-- Lecteur QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 18px;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 25px auto 0;
            border-radius: 15px;
            overflow: hidden;
            display: none;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }

        #stop {
            display: none;
            margin-top: 20px;
            background: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>GEEKSTER</h1>

    <div class="subtitle">
        Votre jeu musical geek
    </div>

    <button id="scanButton">
        📷 SCANNER UNE CARTE
    </button>

    <div id="reader"></div>

    <div id="result"></div>

    <button id="stop">
        ✕ FERMER LE SCANNER
    </button>

</div>


<script>

    let scanner = null;

    const scanButton = document.getElementById("scanButton");
    const stopButton = document.getElementById("stop");
    const reader = document.getElementById("reader");
    const result = document.getElementById("result");


    // Quand on appuie sur SCANNER
    scanButton.addEventListener("click", async () => {

        scanButton.style.display = "none";
        reader.style.display = "block";
        stopButton.style.display = "inline-block";
        result.style.display = "none";

        scanner = new Html5Qrcode("reader");

        try {

            await scanner.start(
                { facingMode: "environment" },

                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                (decodedText) => {

                    // QR détecté !
                    console.log("QR détecté :", decodedText);

                    result.innerHTML =
                        "✅ CARTE RECONNUE<br><br>" +
                        "<small>" + decodedText + "</small>";

                    result.style.display = "block";

                    // On arrête temporairement le scanner
                    scanner.stop();

                    reader.style.display = "none";
                    stopButton.style.display = "none";

                },

                (errorMessage) => {
                    // Rien à faire si aucun QR n'est encore détecté
                }

            );

        } catch (error) {

            console.error(error);

            result.innerHTML =
                "❌ Impossible d'utiliser la caméra.";

            result.style.display = "block";

        }

    });


    // Bouton fermer
    stopButton.addEventListener("click", async () => {

        if (scanner) {

            try {
                await scanner.stop();
            } catch (error) {
                console.log(error);
            }

            scanner = null;
        }

        reader.style.display = "none";
        stopButton.style.display = "none";
        result.style.display = "none";
        scanButton.style.display = "inline-block";

    });

</script>

</body>
</html>
