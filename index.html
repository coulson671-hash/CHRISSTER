<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Geekster</title>


    <!-- =====================================
         LECTEUR QR
    ====================================== -->

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #111;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .container {

            width: 100%;

            max-width: 500px;

            padding: 25px;

            text-align: center;
        }


        h1 {

            font-size: 48px;

            margin: 0 0 10px;

            letter-spacing: 4px;
        }


        .subtitle {

            color: #aaa;

            margin-bottom: 35px;

            font-size: 17px;
        }


        button {

            border: none;

            border-radius: 12px;

            padding: 17px 28px;

            font-size: 18px;

            font-weight: bold;

            color: white;

            background: #e50914;

            cursor: pointer;

            margin: 8px;
        }


        button:active {

            transform: scale(0.97);
        }


        .secondary {

            background: #333;
        }


        .youtube {

            background: #ff0000;
        }


        #reader {

            width: 100%;

            max-width: 400px;

            margin: 25px auto;

            display: none;

            overflow: hidden;

            border-radius: 15px;
        }


        #stopButton {

            display: none;

            background: #333;
        }


        /* =====================================
           ÉCRANS
        ====================================== */


        #musicScreen,
        #searchScreen,
        #errorScreen {

            display: none;
        }


        /* =====================================
           MUSIQUE PRÊTE
        ====================================== */


        #readyIcon {

            font-size: 65px;

            margin-bottom: 10px;
        }


        #readyText {

            font-size: 27px;

            font-weight: bold;

            margin-bottom: 30px;
        }


        /* =====================================
           RECHERCHE
        ====================================== */


        #searchIcon {

            font-size: 60px;

            margin-bottom: 10px;
        }


        #searchTitle {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        #searchQuery {

            background: #222;

            border-radius: 12px;

            padding: 18px;

            margin: 20px 0 25px;

            font-size: 17px;

            line-height: 1.5;

            word-break: break-word;
        }


        .smallText {

            color: #999;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 20px;
        }


        /* =====================================
           LECTEUR YOUTUBE
        ====================================== */


        #youtubePlayer {

            width: 100%;

            aspect-ratio: 16 / 9;

            border-radius: 12px;

            overflow: hidden;

            background: #000;

            display: none;

            margin-bottom: 20px;
        }


        #youtubePlayer iframe {

            width: 100%;

            height: 100%;

            border: 0;
        }


        #nextButton {

            display: none;

            background: #333;
        }


        /* =====================================
           ERREUR
        ====================================== */


        #errorTitle {

            color: #ff5555;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        #errorContent {

            background: #222;

            border-radius: 12px;

            padding: 18px;

            word-break: break-word;

            font-family: monospace;

            font-size: 13px;

            margin-bottom: 25px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================
         ACCUEIL
    ====================================== -->


    <div id="homeScreen">


        <h1>GEEKSTER</h1>


        <div class="subtitle">

            Votre jeu musical geek

        </div>


        <button id="scanButton">

            📷 SCANNER UNE CARTE

        </button>


        <div id="reader"></div>


        <button id="stopButton">

            ✕ FERMER LE SCANNER

        </button>


    </div>



    <!-- =====================================
         ÉCRAN MUSIQUE
    ====================================== -->


    <div id="musicScreen">


        <div id="readyIcon">

            🎵

        </div>


        <div id="readyText">

            MUSIQUE PRÊTE

        </div>


        <button
            id="playButton">

            ▶️ LANCER LA MUSIQUE

        </button>


        <div id="youtubePlayer"></div>


        <button
            id="nextButton"
            class="secondary">

            📷 CARTE SUIVANTE

        </button>


    </div>



    <!-- =====================================
         ÉCRAN RECHERCHE
    ====================================== -->


    <div id="searchScreen">


        <div id="searchIcon">

            🔎

        </div>


        <div id="searchTitle">

            RECHERCHE DÉTECTÉE

        </div>


        <div
            class="smallText">

            Cette carte contient une recherche
            YouTube plutôt qu'une vidéo précise.

        </div>


        <div id="searchQuery"></div>


        <button
            id="searchButton"
            class="youtube">

            ▶️ RECHERCHER SUR YOUTUBE

        </button>


        <br>


        <button
            id="searchNextButton"
            class="secondary">

            📷 CARTE SUIVANTE

        </button>


    </div>



    <!-- =====================================
         ERREUR
    ====================================== -->


    <div id="errorScreen">


        <div id="errorTitle">

            ❌ CARTE NON RECONNUE

        </div>


        <div
            id="errorContent">
        </div>


        <button
            id="errorBackButton">

            📷 RÉESSAYER

        </button>


    </div>


</div>



<script>


/* ==========================================
   BASE DE DONNÉES GEEKSTER
   ========================================== */


/*
    Nos propres cartes.

    Exemple :

    GEEKSTER-001

    devient :

    Song of Storms
*/


const cartes = {

    "001": "UtgHZaq0EGs"

};



/* ==========================================
   VARIABLES
   ========================================== */


let qrScanner = null;

let currentVideoID = null;

let currentSearchURL = null;



/* ==========================================
   ÉLÉMENTS HTML
   ========================================== */


const homeScreen =
    document.getElementById(
        "homeScreen"
    );


const musicScreen =
    document.getElementById(
        "musicScreen"
    );


const searchScreen =
    document.getElementById(
        "searchScreen"
    );


const errorScreen =
    document.getElementById(
        "errorScreen"
    );


const scanButton =
    document.getElementById(
        "scanButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const reader =
    document.getElementById(
        "reader"
    );


const playButton =
    document.getElementById(
        "playButton"
    );


const youtubePlayer =
    document.getElementById(
        "youtubePlayer"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const searchQuery =
    document.getElementById(
        "searchQuery"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const searchNextButton =
    document.getElementById(
        "searchNextButton"
    );


const errorContent =
    document.getElementById(
        "errorContent"
    );


const errorBackButton =
    document.getElementById(
        "errorBackButton"
    );



/* ==========================================
   SCANNER
   ========================================== */


scanButton.addEventListener(
    "click",
    lancerScanner
);


async function lancerScanner() {


    scanButton.style.display =
        "none";


    stopButton.style.display =
        "inline-block";


    reader.style.display =
        "block";


    qrScanner =
        new Html5Qrcode(
            "reader"
        );


    try {


        await qrScanner.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps: 10,

                qrbox: {

                    width: 250,

                    height: 250

                }

            },


            async (decodedText) => {


                console.log(
                    "QR détecté :",
                    decodedText
                );


                await arreterScanner();


                traiterQR(
                    decodedText
                );

            },


            (errorMessage) => {

                /*
                    Aucun QR détecté.
                */

            }

        );


    }

    catch (error) {


        console.error(error);


        alert(
            "Impossible d'utiliser la caméra."
        );


        await arreterScanner();

    }

}



/* ==========================================
   TRAITER LE QR
   ========================================== */


function traiterQR(decodedText) {


    /*
        ======================================
        CAS 1
        NOS QR GEEKSTER
        ======================================
    */


    const geeksterMatch =
        decodedText.match(
            /GEEKSTER-(\d+)/i
        );


    if (geeksterMatch) {


        const numero =
            geeksterMatch[1];


        const videoID =
            cartes[numero];


        if (videoID) {


            currentVideoID =
                videoID;


            afficherMusique();


            return;

        }

    }



    /*
        ======================================
        CAS 2
        LIEN DIRECT VERS UNE VIDÉO YOUTUBE
        ======================================
    */


    const youtubeID =
        extraireYouTubeID(
            decodedText
        );


    if (youtubeID) {


        currentVideoID =
            youtubeID;


        afficherMusique();


        return;

    }



    /*
        ======================================
        CAS 3
        RECHERCHE YOUTUBE
        ======================================
    */


    const recherche =
        extraireRechercheYouTube(
            decodedText
        );


    if (recherche) {


        currentSearchURL =
            decodedText;


        afficherRecherche(
            recherche
        );


        return;

    }



    /*
        ======================================
        CAS INCONNU
        ======================================
    */


    afficherErreur(
        decodedText
    );

}



/* ==========================================
   EXTRAIRE UNE VIDÉO YOUTUBE
   ========================================== */


function extraireYouTubeID(url) {


    try {


        const adresse =
            new URL(url);


        /*
            youtube.com/watch?v=
        */


        if (
            adresse.hostname.includes(
                "youtube.com"
            ) &&
            adresse.pathname ===
                "/watch"
        ) {


            return adresse.searchParams.get(
                "v"
            );

        }


        /*
            youtu.be/XXXX
        */


        if (
            adresse.hostname ===
                "youtu.be"
        ) {


            return adresse.pathname
                .substring(1)
                .split("/")[0];

        }


        /*
            youtube.com/embed/XXXX
        */


        if (
            adresse.hostname.includes(
                "youtube.com"
            ) &&
            adresse.pathname.startsWith(
                "/embed/"
            )
        ) {


            return adresse.pathname
                .split("/embed/")[1]
                .split("/")[0];

        }


    }

    catch (error) {


        console.log(
            "Erreur URL YouTube :",
            error
        );

    }


    return null;

}



/* ==========================================
   EXTRAIRE UNE RECHERCHE YOUTUBE
   ========================================== */


function extraireRechercheYouTube(url) {


    try {


        const adresse =
            new URL(url);


        /*
            Nous recherchons :

            /results

            avec :

            search_query=
        */


        if (
            adresse.hostname.includes(
                "youtube.com"
            ) &&
            adresse.pathname ===
                "/results"
        ) {


            const recherche =
                adresse.searchParams.get(
                    "search_query"
                );


            if (recherche) {

                return recherche;

            }

        }

    }

    catch (error) {


        console.log(
            "Erreur recherche YouTube :",
            error
        );

    }


    return null;

}



/* ==========================================
   AFFICHER MUSIQUE
   ========================================== */


function afficherMusique() {


    homeScreen.style.display =
        "none";


    searchScreen.style.display =
        "none";


    errorScreen.style.display =
        "none";


    musicScreen.style.display =
        "block";


    youtubePlayer.style.display =
        "none";


    youtubePlayer.innerHTML =
        "";


    playButton.style.display =
        "inline-block";


    nextButton.style.display =
        "none";

}



/* ==========================================
   LANCER MUSIQUE
   ========================================== */


playButton.addEventListener(
    "click",
    () => {


        if (!currentVideoID) {

            return;

        }


        playButton.style.display =
            "none";


        youtubePlayer.style.display =
            "block";


        youtubePlayer.innerHTML = `

            <iframe

                src="https://www.youtube.com/embed/${currentVideoID}?autoplay=1&rel=0&modestbranding=1"

                title="Geekster"

                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture
                "

                allowfullscreen>

            </iframe>

        `;


        nextButton.style.display =
            "inline-block";

    }
);



/* ==========================================
   AFFICHER RECHERCHE
   ========================================== */


function afficherRecherche(
    recherche
) {


    homeScreen.style.display =
        "none";


    musicScreen.style.display =
        "none";


    errorScreen.style.display =
        "none";


    searchScreen.style.display =
        "block";


    /*
        Affichage du texte recherché.
    */


    searchQuery.textContent =
        recherche;

}



/* ==========================================
   OUVRIR RECHERCHE YOUTUBE
   ========================================== */


searchButton.addEventListener(
    "click",
    () => {


        if (!currentSearchURL) {

            return;

        }


        /*
            Ouvre la recherche YouTube
            dans un nouvel onglet.
        */


        window.open(
            currentSearchURL,
            "_blank"
        );

    }
);



/* ==========================================
   AFFICHER ERREUR
   ========================================== */


function afficherErreur(
    contenu
) {


    homeScreen.style.display =
        "none";


    musicScreen.style.display =
        "none";


    searchScreen.style.display =
        "none";


    errorScreen.style.display =
        "block";


    errorContent.textContent =
        contenu;

}



/* ==========================================
   CARTE SUIVANTE
   ========================================== */


nextButton.addEventListener(
    "click",
    nouvelleCarte
);


searchNextButton.addEventListener(
    "click",
    nouvelleCarte
);


function nouvelleCarte() {


    currentVideoID =
        null;


    currentSearchURL =
        null;


    youtubePlayer.innerHTML =
        "";


    youtubePlayer.style.display =
        "none";


    musicScreen.style.display =
        "none";


    searchScreen.style.display =
        "none";


    errorScreen.style.display =
        "none";


    homeScreen.style.display =
        "block";


    scanButton.style.display =
        "inline-block";


    playButton.style.display =
        "inline-block";


    nextButton.style.display =
        "none";

}



/* ==========================================
   RETOUR APRÈS ERREUR
   ========================================== */


errorBackButton.addEventListener(
    "click",
    nouvelleCarte
);



/* ==========================================
   ARRÊTER LE SCANNER
   ========================================== */


async function arreterScanner() {


    if (qrScanner) {


        try {

            await qrScanner.stop();

        }

        catch (error) {

            console.log(error);

        }


        qrScanner = null;

    }


    reader.style.display =
        "none";


    stopButton.style.display =
        "none";

}



/* ==========================================
   BOUTON FERMER SCANNER
   ========================================== */


stopButton.addEventListener(
    "click",
    async () => {


        await arreterScanner();


        scanButton.style.display =
            "inline-block";

    }
);


</script>


</body>

</html>
