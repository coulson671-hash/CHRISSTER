<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Geekster</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 25px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 35px;
            font-size: 17px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 17px 28px;
            font-size: 19px;
            font-weight: bold;
            color: white;
            background: #e50914;
            cursor: pointer;
            margin: 8px;
        }

        button:active {
            transform: scale(0.97);
        }

        .secondary {
            background: #333;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 25px auto;
            display: none;
            overflow: hidden;
            border-radius: 15px;
        }

        #stopButton {
            display: none;
            background: #333;
        }

        #diagnosticScreen {
            display: none;
        }

        #qrContent {
            margin: 25px 0;

            padding: 20px;

            background: #222;

            border-radius: 12px;

            word-break: break-all;

            text-align: left;

            font-family: monospace;

            font-size: 14px;

            line-height: 1.5;

            max-height: 300px;

            overflow-y: auto;
        }

        .success {
            color: #4cff88;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ============================= -->
    <!-- ACCUEIL -->
    <!-- ============================= -->

    <div id="homeScreen">

        <h1>GEEKSTER</h1>

        <div class="subtitle">
            Diagnostic QR
        </div>

        <button id="scanButton">
            📷 SCANNER UNE CARTE
        </button>

        <div id="reader"></div>

        <button id="stopButton">
            ✕ FERMER LE SCANNER
        </button>

    </div>


    <!-- ============================= -->
    <!-- DIAGNOSTIC -->
    <!-- ============================= -->

    <div id="diagnosticScreen">

        <div class="success">

            ✅ QR DÉTECTÉ

        </div>


        <h2>

            Contenu exact du QR

        </h2>


        <div id="qrContent"></div>


        <button
            id="scanAgainButton"
            class="secondary">

            📷 SCANNER UNE AUTRE CARTE

        </button>

    </div>


</div>



<script>


/* ==========================================
   VARIABLES
   ========================================== */


let qrScanner = null;


const scanButton =
    document.getElementById(
        "scanButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const reader =
    document.getElementById(
        "reader"
    );


const homeScreen =
    document.getElementById(
        "homeScreen"
    );


const diagnosticScreen =
    document.getElementById(
        "diagnosticScreen"
    );


const qrContent =
    document.getElementById(
        "qrContent"
    );


const scanAgainButton =
    document.getElementById(
        "scanAgainButton"
    );



/* ==========================================
   LANCER LE SCANNER
   ========================================== */


scanButton.addEventListener(
    "click",
    lancerScanner
);


async function lancerScanner() {


    scanButton.style.display =
        "none";


    stopButton.style.display =
        "inline-block";


    reader.style.display =
        "block";


    qrScanner =
        new Html5Qrcode(
            "reader"
        );


    try {


        await qrScanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },


            async (decodedText) => {


                console.log(
                    "QR DÉTECTÉ :",
                    decodedText
                );


                await arreterScanner();


                afficherDiagnostic(
                    decodedText
                );

            },


            (errorMessage) => {

                // Rien à faire
                // tant qu'aucun QR
                // n'est détecté.

            }

        );


    }

    catch (error) {


        console.error(error);


        alert(
            "Impossible d'utiliser la caméra."
        );


        await arreterScanner();

    }

}



/* ==========================================
   AFFICHER LE CONTENU DU QR
   ========================================== */


function afficherDiagnostic(
    contenu
) {


    homeScreen.style.display =
        "none";


    diagnosticScreen.style.display =
        "block";


    /*
        Affichage du contenu
        EXACTEMENT comme le scanner
        l'a reçu.
    */


    qrContent.textContent =
        contenu;

}



/* ==========================================
   ARRÊTER LE SCANNER
   ========================================== */


async function arreterScanner() {


    if (qrScanner) {


        try {

            await qrScanner.stop();

        }

        catch (error) {

            console.log(error);

        }


        qrScanner = null;

    }


    reader.style.display =
        "none";


    stopButton.style.display =
        "none";

}



/* ==========================================
   SCANNER UNE AUTRE CARTE
   ========================================== */


scanAgainButton.addEventListener(
    "click",
    () => {


        diagnosticScreen.style.display =
            "none";


        homeScreen.style.display =
            "block";


        scanButton.style.display =
            "inline-block";

    }
);



/* ==========================================
   FERMER LE SCANNER
   ========================================== */


stopButton.addEventListener(
    "click",
    async () => {


        await arreterScanner();


        scanButton.style.display =
            "inline-block";

    }
);


</script>


</body>

</html>
