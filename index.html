<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Geekster</title>

    <!-- Lecteur QR -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #111;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .container {

            width: 100%;

            max-width: 500px;

            padding: 25px;

            text-align: center;
        }


        h1 {

            font-size: 48px;

            margin: 0 0 10px;

            letter-spacing: 4px;
        }


        .subtitle {

            color: #aaa;

            margin-bottom: 35px;

            font-size: 17px;
        }


        button {

            border: none;

            border-radius: 12px;

            padding: 17px 28px;

            font-size: 19px;

            font-weight: bold;

            color: white;

            background: #e50914;

            cursor: pointer;
        }


        button:active {

            transform: scale(0.97);
        }


        #reader {

            width: 100%;

            max-width: 400px;

            margin: 25px auto;

            display: none;

            overflow: hidden;

            border-radius: 15px;
        }


        #stopButton {

            display: none;

            background: #333;

            margin-top: 10px;
        }


        #musicScreen {

            display: none;
        }


        #musicTitle {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        #youtubePlayer {

            width: 100%;

            aspect-ratio: 16 / 9;

            border-radius: 12px;

            overflow: hidden;

            background: #000;

            margin-bottom: 25px;
        }


        #youtubePlayer iframe {

            width: 100%;

            height: 100%;

            border: 0;
        }


        #nextButton {

            display: none;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ========================= -->
    <!-- ÉCRAN D'ACCUEIL -->
    <!-- ========================= -->

    <div id="homeScreen">

        <h1>GEEKSTER</h1>

        <div class="subtitle">

            Votre jeu musical geek

        </div>


        <button id="scanButton">

            📷 SCANNER UNE CARTE

        </button>


        <div id="reader"></div>


        <button id="stopButton">

            ✕ FERMER LE SCANNER

        </button>

    </div>



    <!-- ========================= -->
    <!-- ÉCRAN MUSIQUE -->
    <!-- ========================= -->

    <div id="musicScreen">


        <div id="musicTitle">

            🎵 MUSIQUE PRÊTE

        </div>


        <!--
            Le lecteur YouTube sera placé ici
        -->

        <div id="youtubePlayer"></div>


        <button id="nextButton">

            📷 CARTE SUIVANTE

        </button>


    </div>


</div>



<script>


/* ==========================================
   VARIABLES
   ========================================== */


let qrScanner = null;


/*
    Notre première musique de test.

    Song of Storms :

    https://youtu.be/UtgHZaq0EGs

    L'identifiant est :

    UtgHZaq0EGs
*/


const SONG_OF_STORMS = "UtgHZaq0EGs";


const scanButton =
    document.getElementById("scanButton");


const stopButton =
    document.getElementById("stopButton");


const reader =
    document.getElementById("reader");


const homeScreen =
    document.getElementById("homeScreen");


const musicScreen =
    document.getElementById("musicScreen");


const youtubePlayer =
    document.getElementById("youtubePlayer");


const nextButton =
    document.getElementById("nextButton");



/* ==========================================
   LANCER LE SCANNER
   ========================================== */


scanButton.addEventListener("click", async () => {


    scanButton.style.display = "none";

    stopButton.style.display = "inline-block";

    reader.style.display = "block";


    qrScanner = new Html5Qrcode("reader");


    try {


        await qrScanner.start(

            {
                facingMode: "environment"
            },

            {

                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },


            async (decodedText) => {


                console.log(
                    "QR détecté :",
                    decodedText
                );


                /*
                    On arrête le scanner
                */

                await arreterScanner();


                /*
                    Pour l'instant,
                    n'importe quelle carte
                    lance Song of Storms.
                */

                afficherMusique(
                    SONG_OF_STORMS
                );

            },


            (errorMessage) => {

                /*
                    Aucun QR détecté.
                    On ne fait rien.
                */

            }

        );


    }

    catch (error) {


        console.error(error);


        alert(
            "Impossible d'utiliser la caméra."
        );


        reader.style.display = "none";

        stopButton.style.display = "none";

        scanButton.style.display = "inline-block";

    }

});



/* ==========================================
   ARRÊTER LE SCANNER
   ========================================== */


async function arreterScanner() {


    if (qrScanner) {


        try {

            await qrScanner.stop();

        }

        catch (error) {

            console.log(error);

        }


        qrScanner = null;

    }


    reader.style.display = "none";

    stopButton.style.display = "none";

}



/* ==========================================
   AFFICHER LA MUSIQUE
   ========================================== */


function afficherMusique(videoID) {


    /*
        On cache l'écran du scanner
    */

    homeScreen.style.display = "none";


    /*
        On affiche l'écran musique
    */

    musicScreen.style.display = "block";


    /*
        On crée directement
        un lecteur YouTube.

        Pas d'API YouTube.
        Pas de JavaScript compliqué.
    */


    youtubePlayer.innerHTML = `

        <iframe

            src="https://www.youtube.com/embed/${videoID}"

            title="Lecteur musical"

            allow="
                autoplay;
                encrypted-media;
                picture-in-picture
            "

            allowfullscreen>

        </iframe>

    `;


    /*
        On affiche le bouton
        pour scanner une nouvelle carte.
    */

    nextButton.style.display = "inline-block";

}



/* ==========================================
   CARTE SUIVANTE
   ========================================== */


nextButton.addEventListener(
    "click",
    () => {


        /*
            On supprime le lecteur
        */

        youtubePlayer.innerHTML = "";


        /*
            On revient à l'écran
            du scanner
        */

        musicScreen.style.display = "none";

        homeScreen.style.display = "block";


        scanButton.style.display = "inline-block";

        nextButton.style.display = "none";

    }
);



/* ==========================================
   FERMER LE SCANNER
   ========================================== */


stopButton.addEventListener(
    "click",
    async () => {


        await arreterScanner();


        scanButton.style.display = "inline-block";

    }
);


</script>


</body>

</html>
