<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geekster Gaming</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    font-size: 46px;
    letter-spacing: 5px;
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 17px 25px;
    margin: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #e50914;
    color: white;
}

button.secondary {
    background: #333;
}

button:hover {
    opacity: 0.85;
}

.box {
    background: #222;
    border-radius: 15px;
    padding: 25px;
    margin: 20px 0;
}

.ready {
    font-size: 24px;
    font-weight: bold;
}

.ready-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.year {
    font-size: 75px;
    font-weight: bold;
    color: #f5be32;
    margin: 20px 0;
}

.music {
    font-size: 22px;
    font-weight: bold;
}

.game {
    color: #ccc;
    font-size: 18px;
    margin-top: 10px;
}

#reader {
    width: 100%;
    margin: 20px auto;
}

#gameScreen,
#revealScreen,
#errorScreen,
#searchScreen {
    display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>GEEKSTER</h1>

<div class="subtitle">
🎮 Gaming Edition
</div>


<!-- ACCUEIL -->

<div id="homeScreen">

    <div class="box">

        <h2>Prêt à jouer ?</h2>

        <p>
        Scanne le QR code d'une carte.
        </p>

        <button onclick="startScanner()">
            📷 SCANNER UNE CARTE
        </button>

    </div>

    <div id="reader"></div>

</div>


<!-- CARTE RECONNUE -->

<div id="gameScreen">

    <div class="box">

        <div class="ready-icon">
            🎵
        </div>

        <div class="ready">
            MUSIQUE PRÊTE
        </div>

        <p>
        Tu peux lancer la musique.
        </p>

    </div>

    <button onclick="launchMusic()">
        ▶️ LANCER LA MUSIQUE
    </button>

    <br>

    <button class="secondary" onclick="revealCard()">
        👀 RÉVÉLER LA CARTE
    </button>

    <br>

    <button class="secondary" onclick="nextCard()">
        📷 CARTE SUIVANTE
    </button>

</div>


<!-- RECHERCHE YOUTUBE -->

<div id="searchScreen">

    <div class="box">

        <div class="ready-icon">
            🔎
        </div>

        <h2>Musique trouvée</h2>

        <p id="searchText"></p>

        <p>
        YouTube va s'ouvrir pour lancer la musique.
        </p>

    </div>

    <button onclick="openYouTube()">
        ▶️ OUVRIR YOUTUBE
    </button>

    <br>

    <button class="secondary" onclick="revealCard()">
        👀 RÉVÉLER LA CARTE
    </button>

</div>


<!-- RÉVÉLATION -->

<div id="revealScreen">

    <div class="box">

        <h2>🎉 CARTE</h2>

        <div class="music" id="musicTitle"></div>

        <div class="game" id="gameTitle"></div>

        <div class="year" id="cardYear"></div>

    </div>

    <button onclick="nextCard()">
        📷 CARTE SUIVANTE
    </button>

</div>


<!-- ERREUR -->

<div id="errorScreen">

    <div class="box">

        <h2>❌ CARTE NON RECONNUE</h2>

        <p id="errorText"></p>

    </div>

    <button onclick="nextCard()">
        RETOUR
    </button>

</div>

</div>


<script>


/* =====================================================
   BASE DES 20 CARTES
===================================================== */

const cards = {

    "001": {
        music: "Korobeiniki",
        game: "Tetris",
        year: 1984
    },

    "002": {
        music: "Ground Theme",
        game: "Super Mario Bros.",
        year: 1985
    },

    "003": {
        music: "Main Theme",
        game: "The Legend of Zelda",
        year: 1986
    },

    "004": {
        music: "Brinstar",
        game: "Metroid",
        year: 1986
    },

    "005": {
        music: "Main Theme",
        game: "Final Fantasy",
        year: 1987
    },

    "006": {
        music: "Dr. Wily Stage 1",
        game: "Mega Man 2",
        year: 1988
    },

    "007": {
        music: "Main Theme",
        game: "Prince of Persia",
        year: 1989
    },

    "008": {
        music: "Main Theme",
        game: "SimCity",
        year: 1989
    },

    "009": {
        music: "Overworld Theme",
        game: "Super Mario World",
        year: 1990
    },

    "010": {
        music: "Opening Theme",
        game: "The Secret of Monkey Island",
        year: 1990
    },

    "011": {
        music: "Green Hill Zone",
        game: "Sonic the Hedgehog",
        year: 1991
    },

    "012": {
        music: "Guile Theme",
        game: "Street Fighter II",
        year: 1991
    },

    "013": {
        music: "Main Theme",
        game: "Final Fantasy IV",
        year: 1991
    },

    "014": {
        music: "Stage 1",
        game: "Super Castlevania IV",
        year: 1991
    },

    "015": {
        music: "Dark World",
        game: "The Legend of Zelda: A Link to the Past",
        year: 1991
    },

    "016": {
        music: "Main Theme",
        game: "Mortal Kombat",
        year: 1992
    },

    "017": {
        music: "Rainbow Road",
        game: "Super Mario Kart",
        year: 1992
    },

    "018": {
        music: "At Doom's Gate",
        game: "Doom",
        year: 1993
    },

    "019": {
        music: "Main Theme",
        game: "Myst",
        year: 1993
    },

    "020": {
        music: "Main Theme",
        game: "Star Fox",
        year: 1993
    }

};


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let currentCard = null;

let youtubeSearchURL = "";


/* =====================================================
   AFFICHAGE DES ECRANS
===================================================== */

function showScreen(screen) {

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("searchScreen").style.display = "none";
    document.getElementById("revealScreen").style.display = "none";
    document.getElementById("errorScreen").style.display = "none";

    document.getElementById(screen).style.display = "block";
}


/* =====================================================
   SCANNER
===================================================== */

async function startScanner() {

    document.getElementById("reader").style.display = "block";

    scanner = new Html5Qrcode("reader");

    try {

        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            async function(decodedText) {

                await stopScanner();

                processQRCode(decodedText);

            },

            function(errorMessage) {

                // Ignore les erreurs normales de recherche du QR

            }

        );

    }

    catch(error) {

        document.getElementById("errorText").textContent =
            "Impossible d'utiliser la caméra.";

        showScreen("errorScreen");

    }

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

    if(scanner) {

        try {

            await scanner.stop();

        }

        catch(error) {}

        scanner = null;

    }

    document.getElementById("reader").style.display = "none";

}


/* =====================================================
   LECTURE DU QR
===================================================== */

function processQRCode(text) {

    const match = text.match(/GEEKSTER-(\d+)/i);

    if(!match) {

        document.getElementById("errorText").textContent =
            "Ce QR code n'est pas une carte Geekster.";

        showScreen("errorScreen");

        return;

    }


    const cardNumber = match[1].padStart(3,"0");


    if(!cards[cardNumber]) {

        document.getElementById("errorText").textContent =
            "Carte Geekster inconnue : " + cardNumber;

        showScreen("errorScreen");

        return;

    }


    currentCard = cards[cardNumber];

    currentCard.number = cardNumber;


    /* Création automatique de la recherche YouTube */

    const query =
        currentCard.music +
        " " +
        currentCard.game +
        " soundtrack";

    youtubeSearchURL =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);


    showScreen("gameScreen");

}


/* =====================================================
   LANCER LA MUSIQUE
===================================================== */

function launchMusic() {

    if(!currentCard) return;


    document.getElementById("searchText").textContent =
        currentCard.music +
        " • " +
        currentCard.game;


    showScreen("searchScreen");

}


/* =====================================================
   OUVRIR YOUTUBE
===================================================== */

function openYouTube() {

    if(youtubeSearchURL) {

        window.open(
            youtubeSearchURL,
            "_blank"
        );

    }

}


/* =====================================================
   RÉVÉLER LA CARTE
===================================================== */

function revealCard() {

    if(!currentCard) return;


    document.getElementById("musicTitle").textContent =
        currentCard.music;


    document.getElementById("gameTitle").textContent =
        currentCard.game;


    document.getElementById("cardYear").textContent =
        currentCard.year;


    showScreen("revealScreen");

}


/* =====================================================
   CARTE SUIVANTE
===================================================== */

function nextCard() {

    currentCard = null;

    youtubeSearchURL = "";

    showScreen("homeScreen");

}


</script>

</body>
</html>
