    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .container {

            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 14px;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 5px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .panel {
            background: #202020;
            border-radius: 18px;
            padding: 20px;
            margin-top: 14px;
            text-align: center;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 17px;
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #e50914;
        }

        button.secondary {
            background: #303030;
        }

        button:active {
            transform: scale(.98);
        }

        .big-icon {
            font-size: 52px;
        }

        .ready {
            font-size: 25px;
            font-weight: bold;
            margin-top: 8px;
        }

        .small {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        /* SCANNER */
        #scannerPanel {
            display: none;
            padding: 0;
            margin-top: 12px;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
        }

        #reader {
            width: 100%;
            min-height: 310px;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
            display: block;
            border-radius: 18px;
        }

        #reader__dashboard_section_swaplink {
            color: white !important;
        }

        #reader__dashboard_section_csr button {
            width: auto !important;
            font-size: 14px !important;
            padding: 10px 14px !important;
        }

        /* ZONE AUDIO : invisible mais valide pour le navigateur */
        .audio-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -10;
        }

        /* ECRAN MUSIQUE */
        .music-status {
            padding: 30px 15px;
        }

        .music-note {
            font-size: 70px;
            margin-bottom: 10px;
        }

        .music-playing {
            font-size: 25px;
            font-weight: bold;
        }

        .music-card {
            margin-top: 12px;
            color: #aaa;
            font-size: 14px;
        }

        /* REVELATION */
        .music-title {
            font-size: 24px;
            font-weight: bold;
        }

        .game-title {
            color: #ccc;
            margin-top: 10px;
            font-size: 18px;
        }

        .year {
            font-size: 78px;
            font-weight: 900;
            color: #f5be32;
            margin-top: 14px;
        }

        .card-number {
            color: #777;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

        <header>
            <div class="logo">GEEKSTER</div>
            <div class="subtitle">🎮 GAMING EDITION</div>
        </header>

        <!-- ACCUEIL -->
        <section id="home" class="screen active">
            <div id="startPanel" class="panel">
                <div class="big-icon">📷</div>
                <h2>Prêt à jouer ?</h2>
                <p class="small">Scanne le QR code de ta carte.</p>
                <button onclick="startScanner()">📷 SCANNER UNE CARTE</button>
            </div>

            <div id="scannerPanel">
                <div id="reader"></div>
                <button class="secondary" onclick="cancelScanner()">✖️ ANNULER LE SCAN</button>
            </div>
        </section>

        <!-- MUSIQUE PRÊTE -->
        <section id="readyScreen" class="screen">
            <div class="panel">
                <div class="big-icon">🎵</div>
                <div class="ready">MUSIQUE PRÊTE</div>
                <p class="small">Carte <span id="readyNumber"></span> reconnue.</p>
            </div>
            <button onclick="playMusic()">▶️ LANCER LA MUSIQUE</button>
            <button class="secondary" onclick="revealCard()">👀 RÉVÉLER LA CARTE</button>
            <button class="secondary" onclick="nextCard()">📷 CARTE SUIVANTE</button>
        </section>

        <!-- MUSIQUE EN COURS -->
        <section id="playerScreen" class="screen">
            <div class="panel music-status">
                <div class="music-note">🎵</div>
                <div class="music-playing">MUSIQUE EN COURS</div>
                <div id="playingNumber" class="music-card"></div>
            </div>
            <button class="secondary" onclick="revealCard()">👀 RÉVÉLER LA CARTE</button>
            <button class="secondary" onclick="nextCard()">📷 CARTE SUIVANTE</button>
        </section>

        <!-- LECTEUR AUDIO -->
        <div class="audio-player">
            <div id="youtubePlayer"></div>
        </div>

        <!-- REVELATION -->
        <section id="revealScreen" class="screen">
            <div class="panel">
                <h2>🎉 CARTE</h2>
                <div id="musicTitle" class="music-title"></div>
                <div id="gameTitle" class="game-title"></div>
                <div id="cardYear" class="year"></div>
                <div id="cardNumber" class="card-number"></div>
            </div>
            <button onclick="nextCard()">📷 CARTE SUIVANTE</button>
        </section>

        <!-- ERREUR -->
        <section id="errorScreen" class="screen">
            <div class="panel">
                <div class="big-icon">❌</div>
                <h2>CARTE NON RECONNUE</h2>
                <p id="errorMessage" class="small"></p>
            </div>
            <button onclick="nextCard()">RETOUR</button>
        </section>

    </div>

        let scanner = null;
        let currentCard = null;
        let ytPlayer = null;

        // API YouTube prête
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtubePlayer', {
                height: '200',
                width: '200',
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 0,
                    'controls': 0
                }
            });
        }

        function showScreen(id) {
            document.querySelectorAll(".screen").forEach(screen => {
                screen.classList.remove("active");
            });
            document.getElementById(id).classList.add("active");
        }

        async function startScanner() {
            document.getElementById("startPanel").style.display = "none";
            document.getElementById("scannerPanel").style.display = "block";

            const reader = document.getElementById("reader");
            reader.innerHTML = "";

            scanner = new Html5Qrcode("reader");

            try {
                await scanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 240, height: 240 } },
                    async function(decodedText) {
                        await stopScanner();
                        processQR(decodedText);
                    },
                    function(errorMessage) {}
                );
            } catch(error) {
                console.error(error);
                await stopScanner();
                document.getElementById("errorMessage").textContent =
                    "La caméra n'a pas pu être démarrée. Vérifie l'autorisation caméra du navigateur.";
                showScreen("errorScreen");
            }
        }

        async function stopScanner() {
            if(scanner) {
                try { await scanner.stop(); } catch(error) {}
                try { scanner.clear(); } catch(error) {}
                scanner = null;
            }
            document.getElementById("scannerPanel").style.display = "none";
            document.getElementById("reader").innerHTML = "";
        }

        async function cancelScanner() {
            await stopScanner();
            document.getElementById("startPanel").style.display = "block";
        }

        function processQR(text) {
            const match = String(text).match(/GEEKSTER[-_]?(\d{1,3})/i);

            if(!match) {
                document.getElementById("errorMessage").textContent =
                    "QR détecté, mais ce n'est pas un QR Geekster : " + text;
                showScreen("errorScreen");
                return;
            }

            const number = match[1].padStart(3, "0");

            if(!cards[number]) {
                document.getElementById("errorMessage").textContent =
                    "Carte Geekster inconnue : " + number;
                showScreen("errorScreen");
                return;
            }

            currentCard = {
                ...cards[number],
                number: number
            };

            document.getElementById("readyNumber").textContent = number;
            showScreen("readyScreen");
        }

        function playMusic() {
            if(!currentCard) return;

            if(!currentCard.youtube) {
                document.getElementById("playingNumber").textContent =
                    "Carte " + currentCard.number + " reconnue, mais vidéo non configurée.";
                showScreen("playerScreen");
                return;
            }

            // Utilisation de l'API YouTube officielle
            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                ytPlayer.loadVideoById(currentCard.youtube);
                ytPlayer.playVideo();
            }

            document.getElementById("playingNumber").textContent =
                "Carte " + currentCard.number + " • Bonne chance ! 😎";

            showScreen("playerScreen");
        }

        function revealCard() {
            if(!currentCard) return;

            document.getElementById("musicTitle").textContent = currentCard.music;
            document.getElementById("gameTitle").textContent = currentCard.game;
            document.getElementById("cardYear").textContent = currentCard.year;
            document.getElementById("cardNumber").textContent = "CARTE " + currentCard.number;

            showScreen("revealScreen");
        }

        async function nextCard() {
            await stopScanner();
            currentCard = null;

            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                ytPlayer.stopVideo();
            }

            document.getElementById("playingNumber").textContent = "";
            document.getElementById("startPanel").style.display = "block";
            showScreen("home");
        }
