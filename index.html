<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geekster</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 18px;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #camera {
            display: none;
            width: 100%;
            margin-top: 25px;
            border-radius: 15px;
        }

        #stop {
            display: none;
            margin-top: 20px;
            background: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GEEKSTER</h1>

        <div class="subtitle">
            Votre jeu musical geek
        </div>

        <button id="scanButton">
            📷 SCANNER UNE CARTE
        </button>

        <video id="camera" autoplay playsinline></video>

        <button id="stop">
            ✕ FERMER LA CAMÉRA
        </button>

    </div>

    <script>
        const scanButton = document.getElementById("scanButton");
        const camera = document.getElementById("camera");
        const stopButton = document.getElementById("stop");

        let stream = null;

        scanButton.addEventListener("click", async () => {

            try {

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment"
                    },
                    audio: false
                });

                camera.srcObject = stream;

                camera.style.display = "block";
                stopButton.style.display = "inline-block";
                scanButton.style.display = "none";

            } catch (error) {

                alert("Impossible d'accéder à la caméra. Vérifie que tu as autorisé l'accès.");

                console.error(error);
            }

        });

        stopButton.addEventListener("click", () => {

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            camera.style.display = "none";
            stopButton.style.display = "none";
            scanButton.style.display = "inline-block";

        });
    </script>

</body>
</html>
