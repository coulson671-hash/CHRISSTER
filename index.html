<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Geekster</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #111;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .container {

            width: 100%;

            max-width: 500px;

            padding: 25px;

            text-align: center;
        }


        h1 {

            font-size: 48px;

            margin: 0 0 10px;

            letter-spacing: 4px;
        }


        .subtitle {

            color: #aaa;

            margin-bottom: 35px;

            font-size: 17px;
        }


        button {

            border: none;

            border-radius: 12px;

            padding: 17px 28px;

            font-size: 19px;

            font-weight: bold;

            color: white;

            background: #e50914;

            cursor: pointer;

            margin: 8px;
        }


        button:active {

            transform: scale(0.97);
        }


        .secondary {

            background: #333;
        }


        #reader {

            width: 100%;

            max-width: 400px;

            margin: 25px auto;

            display: none;

            overflow: hidden;

            border-radius: 15px;
        }


        #stopButton {

            display: none;

            background: #333;

            margin-top: 10px;
        }


        #musicScreen {

            display: none;
        }


        #readyScreen {

            display: block;
        }


        #readyIcon {

            font-size: 65px;

            margin-bottom: 10px;
        }


        #readyText {

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 30px;
        }


        /*
            Le lecteur est caché
            tant que le joueur n'a
            pas appuyé sur LANCER.
        */

        #youtubePlayer {

            width: 100%;

            aspect-ratio: 16 / 9;

            border-radius: 12px;

            overflow: hidden;

            background: #000;

            display: none;

            margin-bottom: 20px;
        }


        #youtubePlayer iframe {

            width: 100%;

            height: 100%;

            border: 0;
        }


        #playButton {

            background: #e50914;

            font-size: 22px;

            padding: 20px 35px;
        }


        #nextButton {

            display: none;

            background: #333;
        }


        #errorScreen {

            display: none;
        }


        #errorText {

            color: #ff5555;

            font-size: 20px;

            margin-bottom: 25px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================================= -->
    <!-- ACCUEIL -->
    <!-- ================================= -->

    <div id="homeScreen">


        <h1>GEEKSTER</h1>


        <div class="subtitle">

            Votre jeu musical geek

        </div>


        <button id="scanButton">

            📷 SCANNER UNE CARTE

        </button>


        <div id="reader"></div>


        <button id="stopButton">

            ✕ FERMER LE SCANNER

        </button>


    </div>



    <!-- ================================= -->
    <!-- MUSIQUE PRÊTE -->
    <!-- ================================= -->

    <div id="musicScreen">


        <div id="readyScreen">


            <div id="readyIcon">

                🎵

            </div>


            <div id="readyText">

                MUSIQUE PRÊTE

            </div>


            <button id="playButton">

                ▶️ LANCER LA MUSIQUE

            </button>


        </div>



        <!-- Lecteur YouTube -->

        <div id="youtubePlayer"></div>


        <button
            id="nextButton"
            class="secondary">

            📷 CARTE SUIVANTE

        </button>


    </div>



    <!-- ================================= -->
    <!-- ERREUR -->
    <!-- ================================= -->

    <div id="errorScreen">


        <div id="errorText">

            ❌ CARTE NON RECONNUE

        </div>


        <button id="errorBackButton">

            📷 RÉESSAYER

        </button>


    </div>


</div>



<script>


/* ==========================================
   BASE DE DONNÉES GEEKSTER
   ========================================== */


/*
    Pour l'instant nous avons seulement
    notre première carte.

    On pourra ajouter :

    "002": "ID_YOUTUBE",
    "003": "ID_YOUTUBE",

    etc.
*/


const cartes = {

    "001": "UtgHZaq0EGs"

};



/* ==========================================
   VARIABLES
   ========================================== */


let qrScanner = null;

let currentVideoID = null;


const scanButton =
    document.getElementById("scanButton");


const stopButton =
    document.getElementById("stopButton");


const reader =
    document.getElementById("reader");


const homeScreen =
    document.getElementById("homeScreen");


const musicScreen =
    document.getElementById("musicScreen");


const readyScreen =
    document.getElementById("readyScreen");


const playButton =
    document.getElementById("playButton");


const youtubePlayer =
    document.getElementById("youtubePlayer");


const nextButton =
    document.getElementById("nextButton");


const errorScreen =
    document.getElementById("errorScreen");


const errorBackButton =
    document.getElementById("errorBackButton");



/* ==========================================
   SCANNER
   ========================================== */


scanButton.addEventListener(
    "click",
    lancerScanner
);



async function lancerScanner() {


    homeScreen.style.display = "block";

    scanButton.style.display = "none";

    stopButton.style.display = "inline-block";

    reader.style.display = "block";


    qrScanner =
        new Html5Qrcode("reader");


    try {


        await qrScanner.start(

            {
                facingMode: "environment"
            },

            {

                fps: 10,

                qrbox: {

                    width: 250,

                    height: 250

                }

            },


            async (decodedText) => {


                console.log(
                    "QR détecté :",
                    decodedText
                );


                await arreterScanner();


                traiterQR(decodedText);

            },


            (errorMessage) => {

                /*
                    Rien à faire si aucun QR
                    n'est détecté.
                */

            }

        );


    }

    catch (error) {


        console.error(error);


        alert(
            "Impossible d'utiliser la caméra."
        );


        arreterScanner();

    }

}



/* ==========================================
   TRAITEMENT DU QR
   ========================================== */


function traiterQR(decodedText) {


    let videoID = null;


    /*
        --------------------------------------
        CAS 1
        QR GEEKSTER
        --------------------------------------

        Exemple :

        GEEKSTER-001
    */


    const geeksterMatch =
        decodedText.match(
            /GEEKSTER-(\d+)/i
        );


    if (geeksterMatch) {


        const numero =
            geeksterMatch[1];


        videoID =
            cartes[numero];

    }


    /*
        --------------------------------------
        CAS 2
        QR YOUTUBE
        --------------------------------------

        Exemple :

        https://www.youtube.com/watch?v=XXXX

        ou :

        https://youtu.be/XXXX
    */


    if (!videoID) {

        videoID =
            extraireYouTubeID(decodedText);

    }


    /*
        --------------------------------------
        SI ON A TROUVÉ UNE MUSIQUE
        --------------------------------------
    */


    if (videoID) {


        currentVideoID =
            videoID;


        afficherMusique();


        return;

    }


    /*
        --------------------------------------
        QR INCONNU
        --------------------------------------
    */


    afficherErreur();

}



/* ==========================================
   EXTRAIRE ID YOUTUBE
   ========================================== */


function extraireYouTubeID(url) {


    try {


        /*
            Format :

            youtube.com/watch?v=XXXX
        */


        if (
            url.includes(
                "youtube.com/watch"
            )
        ) {


            const adresse =
                new URL(url);


            return adresse.searchParams.get(
                "v"
            );

        }


        /*
            Format :

            youtu.be/XXXX
        */


        if (
            url.includes(
                "youtu.be/"
            )
        ) {


            const adresse =
                new URL(url);


            return adresse.pathname
                .substring(1)
                .split("/")[0];

        }


        /*
            Format :

            youtube.com/embed/XXXX
        */


        if (
            url.includes(
                "youtube.com/embed/"
            )
        ) {


            return url
                .split(
                    "youtube.com/embed/"
                )[1]
                .split("?")[0];

        }


    }

    catch (error) {

        console.log(error);

    }


    return null;

}



/* ==========================================
   AFFICHER MUSIQUE PRÊTE
   ========================================== */


function afficherMusique() {


    homeScreen.style.display =
        "none";


    errorScreen.style.display =
        "none";


    musicScreen.style.display =
        "block";


    readyScreen.style.display =
        "block";


    youtubePlayer.style.display =
        "none";


    youtubePlayer.innerHTML =
        "";


    playButton.style.display =
        "inline-block";


    nextButton.style.display =
        "none";

}



/* ==========================================
   LANCER LA MUSIQUE
   ========================================== */


playButton.addEventListener(
    "click",
    () => {


        if (!currentVideoID) {

            return;

        }


        /*
            On cache l'écran
            "musique prête".
        */


        readyScreen.style.display =
            "none";


        youtubePlayer.style.display =
            "block";


        /*
            On crée le lecteur YouTube
            seulement maintenant.

            Le clic de l'utilisateur
            permet au navigateur
            d'autoriser la lecture.
        */


        youtubePlayer.innerHTML = `

            <iframe

                src="https://www.youtube.com/embed/${currentVideoID}?autoplay=1&rel=0&modestbranding=1"

                title="Geekster"

                allow="autoplay; encrypted-media; picture-in-picture"

                allowfullscreen>

            </iframe>

        `;


        nextButton.style.display =
            "inline-block";

    }
);



/* ==========================================
   CARTE SUIVANTE
   ========================================== */


nextButton.addEventListener(
    "click",
    () => {


        currentVideoID = null;


        youtubePlayer.innerHTML =
            "";


        youtubePlayer.style.display =
            "none";


        musicScreen.style.display =
            "none";


        homeScreen.style.display =
            "block";


        scanButton.style.display =
            "inline-block";


        nextButton.style.display =
            "none";

    }
);



/* ==========================================
   ERREUR
   ========================================== */


function afficherErreur() {


    homeScreen.style.display =
        "none";


    musicScreen.style.display =
        "none";


    errorScreen.style.display =
        "block";

}



/* ==========================================
   RETOUR APRÈS ERREUR
   ========================================== */


errorBackButton.addEventListener(
    "click",
    () => {


        errorScreen.style.display =
            "none";


        homeScreen.style.display =
            "block";


        scanButton.style.display =
            "inline-block";

    }
);



/* ==========================================
   ARRÊTER LE SCANNER
   ========================================== */


async function arreterScanner() {


    if (qrScanner) {


        try {

            await qrScanner.stop();

        }

        catch (error) {

            console.log(error);

        }


        qrScanner = null;

    }


    reader.style.display =
        "none";


    stopButton.style.display =
        "none";

}



/* ==========================================
   FERMER LE SCANNER
   ========================================== */


stopButton.addEventListener(
    "click",
    async () => {


        await arreterScanner();


        scanButton.style.display =
            "inline-block";

    }
);


</script>


</body>

</html>
