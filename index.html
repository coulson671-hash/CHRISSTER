<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Geekster Gaming</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 16px;
}

header {
    text-align: center;
    margin-bottom: 14px;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 5px;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.panel {
    background: #202020;
    border-radius: 18px;
    padding: 20px;
    margin-top: 14px;
    text-align: center;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 17px;
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #e50914;
}

button.secondary {
    background: #303030;
}

button:active {
    transform: scale(.98);
}

.big-icon {
    font-size: 52px;
}

.ready {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
}

.small {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
}


/* =========================================
   SCANNER
========================================= */

#scannerPanel {

    display: none;

    padding: 0;

    margin-top: 12px;

    background: #000;

    border-radius: 18px;

    overflow: hidden;
}

#reader {

    width: 100%;

    min-height: 310px;

}

#reader video {

    width: 100% !important;

    height: auto !important;

    display: block;

    border-radius: 18px;

}

#reader__dashboard_section_swaplink {

    color: white !important;

}

#reader__dashboard_section_csr button {

    width: auto !important;

    font-size: 14px !important;

    padding: 10px 14px !important;

}


/* =========================================
   LECTEUR YOUTUBE
========================================= */

.player {

    width: 100%;

    aspect-ratio: 16 / 9;

    margin-top: 18px;

    border-radius: 14px;

    overflow: hidden;

    background: black;

}

.player iframe {

    width: 100%;

    height: 100%;

    border: 0;

}


/* =========================================
   REVELATION
========================================= */

.music-title {

    font-size: 24px;

    font-weight: bold;

}

.game-title {

    color: #ccc;

    margin-top: 10px;

    font-size: 18px;

}

.year {

    font-size: 78px;

    font-weight: 900;

    color: #f5be32;

    margin-top: 14px;

}

.card-number {

    color: #777;

    font-size: 12px;

    margin-top: 10px;

}

</style>

</head>


<body>


<div class="container">


<header>

    <div class="logo">
        GEEKSTER
    </div>

    <div class="subtitle">
        🎮 GAMING EDITION
    </div>

</header>



<!-- =====================================================
     ACCUEIL
===================================================== -->

<section
id="home"
class="screen active">


    <div
    id="startPanel"
    class="panel">


        <div class="big-icon">
            📷
        </div>


        <h2>
            Prêt à jouer ?
        </h2>


        <p class="small">
            Scanne le QR code de ta carte.
        </p>


        <button
        onclick="startScanner()">

            📷 SCANNER UNE CARTE

        </button>


    </div>



    <!--

    IMPORTANT :

    Ce panneau est caché au départ.

    Quand le joueur appuie sur
    "Scanner une carte",

    le bouton disparaît et
    seul le scanner reste visible.

    -->

    <div
    id="scannerPanel">


        <div id="reader"></div>


        <button
        class="secondary"
        onclick="cancelScanner()">

            ✖️ ANNULER LE SCAN

        </button>


    </div>


</section>



<!-- =====================================================
     MUSIQUE PRÊTE
===================================================== -->

<section
id="readyScreen"
class="screen">


    <div class="panel">


        <div class="big-icon">
            🎵
        </div>


        <div class="ready">
            MUSIQUE PRÊTE
        </div>


        <p class="small">

            Carte
            <span id="readyNumber"></span>
            reconnue.

        </p>


    </div>



    <button
    onclick="playMusic()">

        ▶️ LANCER LA MUSIQUE

    </button>



    <button
    class="secondary"
    onclick="revealCard()">

        👀 RÉVÉLER LA CARTE

    </button>



    <button
    class="secondary"
    onclick="nextCard()">

        📷 CARTE SUIVANTE

    </button>


</section>



<!-- =====================================================
     LECTEUR
===================================================== -->

<section
id="playerScreen"
class="screen">


    <div class="panel">


        <div class="big-icon">
            🎵
        </div>


        <div class="ready">
            MUSIQUE EN COURS
        </div>


        <div
        id="youtubePlayer"
        class="player">

        </div>


    </div>



    <button
    class="secondary"
    onclick="revealCard()">

        👀 RÉVÉLER LA CARTE

    </button>



    <button
    class="secondary"
    onclick="nextCard()">

        📷 CARTE SUIVANTE

    </button>


</section>



<!-- =====================================================
     REVELATION
===================================================== -->

<section
id="revealScreen"
class="screen">


    <div class="panel">


        <h2>
            🎉 CARTE
        </h2>


        <div
        id="musicTitle"
        class="music-title">

        </div>


        <div
        id="gameTitle"
        class="game-title">

        </div>


        <div
        id="cardYear"
        class="year">

        </div>


        <div
        id="cardNumber"
        class="card-number">

        </div>


    </div>



    <button
    onclick="nextCard()">

        📷 CARTE SUIVANTE

    </button>


</section>



<!-- =====================================================
     ERREUR
===================================================== -->

<section
id="errorScreen"
class="screen">


    <div class="panel">


        <div class="big-icon">
            ❌
        </div>


        <h2>
            CARTE NON RECONNUE
        </h2>


        <p
        id="errorMessage"
        class="small">

        </p>


    </div>



    <button
    onclick="nextCard()">

        RETOUR

    </button>


</section>



</div>



<script>


/* =====================================================
   CARTES
=====================================================

   Pour le test :

   001 possède déjà ton vrai ID YouTube.

   Les autres cartes sont reconnues,
   mais leurs vidéos ne sont pas encore renseignées.

===================================================== */


const cards = {


    "001": {

        music: "Korobeiniki",

        game: "Tetris",

        year: 1984,

        youtube: "UtgHZaq0EGs"

    },


    "002": {

        music: "Ground Theme",

        game: "Super Mario Bros.",

        year: 1985,

        youtube: ""

    },


    "003": {

        music: "Main Theme",

        game: "The Legend of Zelda",

        year: 1986,

        youtube: ""

    },


    "004": {

        music: "Brinstar",

        game: "Metroid",

        year: 1986,

        youtube: ""

    },


    "005": {

        music: "Main Theme",

        game: "Final Fantasy",

        year: 1987,

        youtube: ""

    },


    "006": {

        music: "Dr. Wily Stage 1",

        game: "Mega Man 2",

        year: 1988,

        youtube: ""

    },


    "007": {

        music: "Main Theme",

        game: "Prince of Persia",

        year: 1989,

        youtube: ""

    },


    "008": {

        music: "Main Theme",

        game: "SimCity",

        year: 1989,

        youtube: ""

    },


    "009": {

        music: "Overworld Theme",

        game: "Super Mario World",

        year: 1990,

        youtube: ""

    },


    "010": {

        music: "Opening Theme",

        game: "The Secret of Monkey Island",

        year: 1990,

        youtube: ""

    },


    "011": {

        music: "Green Hill Zone",

        game: "Sonic the Hedgehog",

        year: 1991,

        youtube: ""

    },


    "012": {

        music: "Guile Theme",

        game: "Street Fighter II",

        year: 1991,

        youtube: ""

    },


    "013": {

        music: "Main Theme",

        game: "Final Fantasy IV",

        year: 1991,

        youtube: ""

    },


    "014": {

        music: "Stage 1",

        game: "Super Castlevania IV",

        year: 1991,

        youtube: ""

    },


    "015": {

        music: "Dark World",

        game: "The Legend of Zelda: A Link to the Past",

        year: 1991,

        youtube: ""

    },


    "016": {

        music: "Main Theme",

        game: "Mortal Kombat",

        year: 1992,

        youtube: ""

    },


    "017": {

        music: "Rainbow Road",

        game: "Super Mario Kart",

        year: 1992,

        youtube: ""

    },


    "018": {

        music: "At Doom's Gate",

        game: "Doom",

        year: 1993,

        youtube: ""

    },


    "019": {

        music: "Main Theme",

        game: "Myst",

        year: 1993,

        youtube: ""

    },


    "020": {

        music: "Main Theme",

        game: "Star Fox",

        year: 1993,

        youtube: ""

    }

};



/* =====================================================
   VARIABLES
===================================================== */


let scanner = null;

let currentCard = null;



/* =====================================================
   AFFICHAGE DES ECRANS
===================================================== */


function showScreen(id) {


    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");


}



/* =====================================================
   DEMARRER LE SCANNER
===================================================== */


async function startScanner() {


    /*
       On cache immédiatement le panneau
       contenant le bouton.

       Le joueur ne voit donc plus
       "Scanner une carte" pendant
       que la caméra fonctionne.
    */


    document
        .getElementById("startPanel")
        .style.display = "none";


    document
        .getElementById("scannerPanel")
        .style.display = "block";


    const reader =
        document.getElementById("reader");


    reader.innerHTML = "";


    scanner =
        new Html5Qrcode("reader");


    try {


        await scanner.start(


            {
                facingMode: "environment"
            },


            {
                fps: 10,

                qrbox: {
                    width: 240,
                    height: 240
                }

            },


            async function(decodedText) {


                /*
                   QR trouvé.

                   On arrête immédiatement
                   la caméra avant de changer
                   d'écran.
                */


                await stopScanner();


                processQR(decodedText);


            },


            function(errorMessage) {

                /*
                   Les erreurs normales
                   de recherche du QR sont ignorées.
                */

            }


        );


    }

    catch(error) {


        console.error(error);


        await stopScanner();


        document
            .getElementById("errorMessage")
            .textContent =

            "La caméra n'a pas pu être démarrée. " +

            "Vérifie l'autorisation caméra " +

            "du navigateur.";


        showScreen("errorScreen");


    }

}



/* =====================================================
   ARRÊTER LE SCANNER
===================================================== */


async function stopScanner() {


    if(scanner) {


        try {

            await scanner.stop();

        }

        catch(error) {

        }


        try {

            scanner.clear();

        }

        catch(error) {

        }


        scanner = null;

    }


    document
        .getElementById("scannerPanel")
        .style.display = "none";


    document
        .getElementById("reader")
        .innerHTML = "";

}



/* =====================================================
   ANNULER LE SCAN
===================================================== */


async function cancelScanner() {


    await stopScanner();


    document
        .getElementById("startPanel")
        .style.display = "block";


}



/* =====================================================
   RECONNAISSANCE DU QR
===================================================== */


function processQR(text) {


    /*
       Le QR normal est :

       GEEKSTER-001

       Mais cette expression accepte aussi :

       GEEKSTER_001

       ou une URL contenant :

       GEEKSTER-001
    */


    const match =

        String(text).match(
            /GEEKSTER[-_]?(\d{1,3})/i
        );


    if(!match) {


        document
            .getElementById("errorMessage")
            .textContent =

            "QR détecté, mais ce n'est pas " +

            "un QR Geekster : " +

            text;


        showScreen("errorScreen");


        return;

    }



    const number =

        match[1].padStart(3, "0");



    if(!cards[number]) {


        document
            .getElementById("errorMessage")
            .textContent =

            "Carte Geekster inconnue : " +

            number;


        showScreen("errorScreen");


        return;

    }



    /*
       On copie la carte.

       Cela évite de modifier
       la base originale.
    */


    currentCard = {

        ...cards[number],

        number: number

    };



    document
        .getElementById("readyNumber")
        .textContent = number;



    showScreen("readyScreen");


}



/* =====================================================
   LANCER LA MUSIQUE
===================================================== */


function playMusic() {


    if(!currentCard) {

        return;

    }


    const player =

        document
            .getElementById("youtubePlayer");


    /*
       On nettoie complètement
       l'ancien lecteur.
    */


    player.innerHTML = "";



    /*
       Si aucune vidéo n'est encore
       renseignée pour cette carte.
    */


    if(!currentCard.youtube) {


        player.innerHTML = `

            <div style="
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:20px;
                color:#aaa;
                text-align:center;
                line-height:1.5;
            ">

                🎵<br><br>

                Carte reconnue !

                <br><br>

                La vidéo YouTube de cette
                carte sera ajoutée ensuite.

            </div>

        `;


        showScreen("playerScreen");


        return;

    }



    /*
       Création du vrai lecteur YouTube.

       Pour la carte 001 :

       UtgHZaq0EGs

    */


    const iframe =

        document.createElement("iframe");



    iframe.src =

        "https://www.youtube.com/embed/" +

        encodeURIComponent(
            currentCard.youtube
        ) +

        "?autoplay=1" +

        "&rel=0" +

        "&playsinline=1";



    iframe.allow =

        "autoplay; encrypted-media; " +

        "picture-in-picture";



    iframe.allowFullscreen = true;



    player.appendChild(iframe);



    showScreen("playerScreen");


}



/* =====================================================
   REVELER LA CARTE
===================================================== */


function revealCard() {


    if(!currentCard) {

        return;

    }


    document
        .getElementById("musicTitle")
        .textContent =

        currentCard.music;


    document
        .getElementById("gameTitle")
        .textContent =

        currentCard.game;


    document
        .getElementById("cardYear")
        .textContent =

        currentCard.year;


    document
        .getElementById("cardNumber")
        .textContent =

        "CARTE " +

        currentCard.number;



    showScreen("revealScreen");


}



/* =====================================================
   CARTE SUIVANTE
===================================================== */


async function nextCard() {


    /*
       Si la caméra tourne encore,
       on l'arrête.
    */


    await stopScanner();



    currentCard = null;



    /*
       On détruit le lecteur YouTube.
    */


    document
        .getElementById("youtubePlayer")
        .innerHTML = "";



    /*
       On remet le bouton scanner.
    */


    document
        .getElementById("startPanel")
        .style.display = "block";



    showScreen("home");


}

</script>


</body>

</html>
