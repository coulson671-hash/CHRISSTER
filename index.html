<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Geekster Gaming</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        radial-gradient(circle at top, #292929 0%, #111 55%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

}

.container {

    width: 100%;

    max-width: 520px;

    margin: auto;

    padding: 18px;

}

header {

    text-align: center;

    margin-bottom: 15px;

}

.logo {

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 5px;

}

.subtitle {

    color: #aaa;

    font-size: 14px;

}

.screen {

    display: none;

}

.screen.active {

    display: block;

}


/* =========================
   BOUTONS
========================= */

button {

    width: 100%;

    border: 0;

    border-radius: 14px;

    padding: 17px;

    margin-top: 12px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background: #e50914;

}

button.secondary {

    background: #292929;

}

button:active {

    transform: scale(.98);

}


/* =========================
   CARTES UI
========================= */

.panel {

    background: #202020;

    border-radius: 18px;

    padding: 22px;

    margin-top: 15px;

    text-align: center;

}

.big-icon {

    font-size: 55px;

}

.ready {

    font-size: 25px;

    font-weight: bold;

    margin-top: 8px;

}

.small {

    color: #aaa;

    font-size: 14px;

}


/* =========================
   SCANNER
========================= */

#reader {

    width: 100%;

    margin: 10px auto 0;

    overflow: hidden;

    border-radius: 18px;

}

#reader video {

    width: 100% !important;

    border-radius: 18px;

}


/* =========================
   LECTEUR
========================= */

.player {

    width: 100%;

    aspect-ratio: 16 / 9;

    margin-top: 20px;

    border-radius: 15px;

    overflow: hidden;

    background: black;

}

.player iframe {

    width: 100%;

    height: 100%;

    border: 0;

}


/* =========================
   REVELATION
========================= */

.music-title {

    font-size: 24px;

    font-weight: bold;

}

.game-title {

    color: #ccc;

    margin-top: 12px;

    font-size: 18px;

}

.year {

    font-size: 80px;

    font-weight: 900;

    color: #f5be32;

    margin-top: 15px;

}


/* =========================
   QR INFO
========================= */

.card-number {

    color: #777;

    font-size: 12px;

    margin-top: 12px;

}

</style>

</head>


<body>


<div class="container">


<header>

<div class="logo">
GEEKSTER
</div>

<div class="subtitle">
🎮 GAMING EDITION
</div>

</header>


<!-- ==================================================
     ACCUEIL
================================================== -->

<section
id="home"
class="screen active">

<div class="panel">

<div class="big-icon">
📷
</div>

<h2>
Prêt à jouer ?
</h2>

<p class="small">
Scanne le QR code de ta carte.
</p>

<button onclick="startScanner()">

📷 SCANNER UNE CARTE

</button>

</div>


<div id="reader"></div>

</section>



<!-- ==================================================
     MUSIQUE PRETE
================================================== -->

<section
id="readyScreen"
class="screen">

<div class="panel">

<div class="big-icon">
🎵
</div>

<div class="ready">
MUSIQUE PRÊTE
</div>

<p class="small">
La carte a été reconnue.
</p>

</div>


<button onclick="playMusic()">

▶️ LANCER LA MUSIQUE

</button>


<button
class="secondary"
onclick="revealCard()">

👀 RÉVÉLER LA CARTE

</button>


<button
class="secondary"
onclick="nextCard()">

📷 CARTE SUIVANTE

</button>

</section>



<!-- ==================================================
     LECTEUR
================================================== -->

<section
id="playerScreen"
class="screen">

<div class="panel">

<div class="big-icon">
🎵
</div>

<div class="ready">
MUSIQUE EN COURS
</div>

<div class="player"
id="youtubePlayer">
</div>

</div>


<button
class="secondary"
onclick="revealCard()">

👀 RÉVÉLER LA CARTE

</button>


<button
class="secondary"
onclick="nextCard()">

📷 CARTE SUIVANTE

</button>

</section>



<!-- ==================================================
     REVELATION
================================================== -->

<section
id="revealScreen"
class="screen">

<div class="panel">

<h2>
🎉 CARTE
</h2>


<div
id="musicTitle"
class="music-title">
</div>


<div
id="gameTitle"
class="game-title">
</div>


<div
id="cardYear"
class="year">
</div>


<div
id="cardNumber"
class="card-number">
</div>

</div>


<button
onclick="nextCard()">

📷 CARTE SUIVANTE

</button>

</section>



<!-- ==================================================
     ERREUR
================================================== -->

<section
id="errorScreen"
class="screen">

<div class="panel">

<div class="big-icon">
❌
</div>

<h2>
CARTE NON RECONNUE
</h2>

<p
id="errorMessage"
class="small">
</p>

</div>


<button
onclick="nextCard()">

RETOUR

</button>

</section>


</div>



<script>


/* =====================================================
   CARTES
===================================================== */

const cards = {


"001": {

    music: "Korobeiniki",

    game: "Tetris",

    year: 1984,

    youtube: "UtgHZaq0EGs"

},


"002": {

    music: "Ground Theme",

    game: "Super Mario Bros.",

    year: 1985,

    youtube: ""

},


"003": {

    music: "Main Theme",

    game: "The Legend of Zelda",

    year: 1986,

    youtube: ""

},


"004": {

    music: "Brinstar",

    game: "Metroid",

    year: 1986,

    youtube: ""

},


"005": {

    music: "Main Theme",

    game: "Final Fantasy",

    year: 1987,

    youtube: ""

},


"006": {

    music: "Dr. Wily Stage 1",

    game: "Mega Man 2",

    year: 1988,

    youtube: ""

},


"007": {

    music: "Main Theme",

    game: "Prince of Persia",

    year: 1989,

    youtube: ""

},


"008": {

    music: "Main Theme",

    game: "SimCity",

    year: 1989,

    youtube: ""

},


"009": {

    music: "Overworld Theme",

    game: "Super Mario World",

    year: 1990,

    youtube: ""

},


"010": {

    music: "Opening Theme",

    game: "The Secret of Monkey Island",

    year: 1990,

    youtube: ""

},


"011": {

    music: "Green Hill Zone",

    game: "Sonic the Hedgehog",

    year: 1991,

    youtube: ""

},


"012": {

    music: "Guile Theme",

    game: "Street Fighter II",

    year: 1991,

    youtube: ""

},


"013": {

    music: "Main Theme",

    game: "Final Fantasy IV",

    year: 1991,

    youtube: ""

},


"014": {

    music: "Stage 1",

    game: "Super Castlevania IV",

    year: 1991,

    youtube: ""

},


"015": {

    music: "Dark World",

    game: "The Legend of Zelda: A Link to the Past",

    year: 1991,

    youtube: ""

},


"016": {

    music: "Main Theme",

    game: "Mortal Kombat",

    year: 1992,

    youtube: ""

},


"017": {

    music: "Rainbow Road",

    game: "Super Mario Kart",

    year: 1992,

    youtube: ""

},


"018": {

    music: "At Doom's Gate",

    game: "Doom",

    year: 1993,

    youtube: ""

},


"019": {

    music: "Main Theme",

    game: "Myst",

    year: 1993,

    youtube: ""

},


"020": {

    music: "Main Theme",

    game: "Star Fox",

    year: 1993,

    youtube: ""

}

};


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let currentCard = null;


/* =====================================================
   AFFICHER UN ECRAN
===================================================== */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");

}


/* =====================================================
   DEMARRER SCANNER
===================================================== */

async function startScanner() {

    const reader = document.getElementById("reader");

    reader.innerHTML = "";

    try {

        scanner =
            new Html5Qrcode("reader");


        await scanner.start(

            {
                facingMode: {
                    exact: "environment"
                }
            },

            {

                fps: 10,

                qrbox: {
                    width: 230,
                    height: 230
                }

            },

            async (decodedText) => {

                await stopScanner();

                processQR(decodedText);

            },

            () => {

                // Rien.
                // Les erreurs de détection normales
                // sont ignorées.

            }

        );

    }

    catch(error) {

        console.error(error);

        document
            .getElementById("errorMessage")
            .textContent =
            "Impossible d'accéder à la caméra.";

        showScreen("errorScreen");

    }

}


/* =====================================================
   ARRETER SCANNER
===================================================== */

async function stopScanner() {

    if(scanner) {

        try {

            await scanner.stop();

        }

        catch(error) {}

        scanner = null;

    }

}


/* =====================================================
   ANALYSER QR
===================================================== */

function processQR(text) {


    const match =
        text.match(
            /GEEKSTER-(\d+)/i
        );


    if(!match) {

        document
            .getElementById("errorMessage")
            .textContent =
            "Ce QR code n'est pas une carte Geekster.";

        showScreen("errorScreen");

        return;

    }


    const number =
        match[1].padStart(3,"0");


    if(!cards[number]) {

        document
            .getElementById("errorMessage")
            .textContent =
            "Carte inconnue : " + number;

        showScreen("errorScreen");

        return;

    }


    currentCard =
        cards[number];


    currentCard.number =
        number;


    showScreen("readyScreen");

}


/* =====================================================
   LANCER MUSIQUE
===================================================== */

function playMusic() {


    if(!currentCard)
        return;


    const player =
        document.getElementById(
            "youtubePlayer"
        );


    player.innerHTML = "";


    if(!currentCard.youtube) {

        player.innerHTML = `

            <div style="
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:20px;
                color:#aaa;
                text-align:center;
            ">

            🎵<br><br>

            Cette carte n'a pas encore
            de vidéo configurée.

            </div>

        `;

        showScreen("playerScreen");

        return;

    }


    const iframe =
        document.createElement("iframe");


    iframe.src =
        "https://www.youtube.com/embed/" +
        currentCard.youtube +
        "?autoplay=1&rel=0";


    iframe.allow =
        "autoplay; encrypted-media";


    iframe.allowFullscreen =
        true;


    player.appendChild(iframe);


    showScreen("playerScreen");

}


/* =====================================================
   REVELER
===================================================== */

function revealCard() {


    if(!currentCard)
        return;


    document
        .getElementById("musicTitle")
        .textContent =
        currentCard.music;


    document
        .getElementById("gameTitle")
        .textContent =
        currentCard.game;


    document
        .getElementById("cardYear")
        .textContent =
        currentCard.year;


    document
        .getElementById("cardNumber")
        .textContent =
        "CARTE " +
        currentCard.number;


    showScreen("revealScreen");

}


/* =====================================================
   CARTE SUIVANTE
===================================================== */

async function nextCard() {


    if(scanner) {

        await stopScanner();

    }


    currentCard = null;


    document
        .getElementById("youtubePlayer")
        .innerHTML = "";


    document
        .getElementById("reader")
        .innerHTML = "";


    showScreen("home");

}


</script>

</body>

</html>
