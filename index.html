<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geekster</title>

    <!-- Lecteur QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- Lecteur YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 18px;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 25px auto 0;
            border-radius: 15px;
            overflow: hidden;
            display: none;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            display: none;
        }

        #musicScreen {
            display: none;
        }

        #player {
            width: 100%;
            margin-top: 25px;
        }

        #stop {
            display: none;
            margin-top: 20px;
            background: #333;
        }

        #scanAgain {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>GEEKSTER</h1>

    <div class="subtitle">
        Votre jeu musical geek
    </div>

    <!-- Écran scanner -->

    <div id="scannerScreen">

        <button id="scanButton">
            📷 SCANNER UNE CARTE
        </button>

        <div id="reader"></div>

        <button id="stop">
            ✕ FERMER LE SCANNER
        </button>

    </div>


    <!-- Écran musique -->

    <div id="musicScreen">

        <div id="result">
            🎵 MUSIQUE PRÊTE
        </div>

        <div id="player"></div>

        <button id="scanAgain">
            📷 CARTE SUIVANTE
        </button>

    </div>

</div>


<script>

    let scanner = null;
    let youtubePlayer = null;

    /*
        ID YOUTUBE DE LA CARTE
        001

        Pour l'instant :
        Song of Storms

        IMPORTANT :
        Remplace cette valeur par l'ID de ta vidéo YouTube.

        Exemple :
        https://www.youtube.com/watch?v=ABC123XYZ

        L'ID serait :
        ABC123XYZ
    */

    const songOfStormsID = "REMPLACE_MOI";


    const scanButton = document.getElementById("scanButton");
    const stopButton = document.getElementById("stop");
    const reader = document.getElementById("reader");

    const scannerScreen = document.getElementById("scannerScreen");
    const musicScreen = document.getElementById("musicScreen");

    const result = document.getElementById("result");
    const scanAgain = document.getElementById("scanAgain");


    /*
        YouTube prépare son lecteur
    */

    function onYouTubeIframeAPIReady() {

        console.log("YouTube prêt.");

    }


    /*
        Lancer le scanner
    */

    scanButton.addEventListener("click", async () => {

        scanButton.style.display = "none";
        reader.style.display = "block";
        stopButton.style.display = "inline-block";

        scanner = new Html5Qrcode("reader");

        try {

            await scanner.start(

                { facingMode: "environment" },

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }

                },

                async (decodedText) => {

                    console.log("QR détecté :", decodedText);

                    /*
                        QR détecté !
                        On arrête immédiatement le scanner.
                    */

                    await scanner.stop();

                    scanner = null;

                    reader.style.display = "none";
                    stopButton.style.display = "none";

                    scannerScreen.style.display = "none";
                    musicScreen.style.display = "block";

                    result.style.display = "block";

                    scanAgain.style.display = "none";

                    /*
                        Pour l'instant, TOUS les QR
                        lancent Song of Storms.

                        Plus tard :
                        QR 001 → Song of Storms
                        QR 002 → autre musique
                        QR 003 → autre musique
                    */

                    lancerMusique(songOfStormsID);

                },

                (errorMessage) => {

                    // Rien à faire lorsqu'aucun QR
                    // n'est détecté.

                }

            );

        }

        catch (error) {

            console.error(error);

            alert(
                "Impossible d'utiliser la caméra."
            );

        }

    });


    /*
        Création du lecteur YouTube
    */

    function lancerMusique(videoID) {

        youtubePlayer = new YT.Player(
            "player",

            {

                height: "220",

                width: "100%",

                videoId: videoID,

                playerVars: {

                    autoplay: 0,

                    controls: 1,

                    rel: 0,

                    modestbranding: 1

                },

                events: {

                    onReady: function(event) {

                        console.log("Lecteur YouTube prêt.");

                    }

                }

            }
        );

    }


    /*
        CARTE SUIVANTE
    */

    scanAgain.addEventListener("click", () => {

        /*
            On détruit le lecteur précédent.
        */

        if (youtubePlayer) {

            youtubePlayer.destroy();

            youtubePlayer = null;

        }

        musicScreen.style.display = "none";

        scannerScreen.style.display = "block";

        result.style.display = "none";

        scanButton.style.display = "inline-block";

    });


    /*
        FERMER LE SCANNER
    */

    stopButton.addEventListener("click", async () => {

        if (scanner) {

            try {

                await scanner.stop();

            }

            catch (error) {

                console.log(error);

            }

            scanner = null;

        }

        reader.style.display = "none";

        stopButton.style.display = "none";

        scanButton.style.display = "inline-block";

    });

</script>

</body>
</html>
