<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geekster</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 50px;
            font-size: 18px;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff1a25;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GEEKSTER</h1>

        <div class="subtitle">
            Votre jeu musical geek
        </div>

        <button>
            📷 SCANNER UNE CARTE
        </button>

    </div>

</body>
</html>
