    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111; color: white; font-family: Arial, sans-serif; min-height: 100vh; }
        .container { width: 100%; max-width: 520px; margin: auto; padding: 16px; }
        header { text-align: center; margin-bottom: 14px; }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: 5px; }
        .subtitle { color: #e50914; font-weight: bold; font-size: 14px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .panel { background: #202020; border-radius: 18px; padding: 20px; margin-top: 14px; text-align: center; }
        button { width: 100%; border: 0; border-radius: 14px; padding: 17px; margin-top: 12px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; background: #e50914; }
        button.secondary { background: #303030; }
        #scannerPanel { display: none; background: #000; border-radius: 18px; overflow: hidden; }
        #reader { width: 100%; min-height: 310px; }
        .audio-player { position: fixed; bottom: -500px; left: -500px; width: 300px; height: 300px; z-index: -999; }
        .audio-player iframe { width: 100%; height: 100%; border: 0; }
        .music-title { font-size: 24px; font-weight: bold; color: #f5be32; }
        .game-title { color: #fff; margin-top: 10px; font-size: 20px; font-weight: bold; }
        .card-date { color: #aaa; margin-top: 6px; font-size: 16px; font-style: italic; }
        .card-number { color: #e50914; margin-top: 12px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">GEEKSTER</div>
            <div class="subtitle">🎬 ANIMATION & MANGA</div>
        </header>

        <section id="home" class="screen active">
            <div id="startPanel" class="panel">
                <h2>Prêt à jouer ?</h2>
                <p>Scanne le QR code de ta carte.</p>
                <button onclick="startScanner()">📷 SCANNER UNE CARTE</button>
            </div>
            <div id="scannerPanel">
                <div id="reader"></div>
                <button class="secondary" onclick="cancelScanner()">✖️ ANNULER</button>
            </div>
        </section>

        <section id="readyScreen" class="screen">
            <div class="panel">
                <h2>MUSIQUE PRÊTE</h2>
                <p>Carte <span id="readyNumber"></span> reconnue.</p>
            </div>
            <button onclick="playMusic()">▶️ LANCER LA MUSIQUE</button>
            <button class="secondary" onclick="revealCard()">👀 RÉVÉLER LA CARTE</button>
        </section>

        <section id="playerScreen" class="screen">
            <div class="panel">
                <h2>🎵 MUSIQUE EN COURS</h2>
                <div id="playingNumber"></div>
            </div>
            <button class="secondary" onclick="revealCard()">👀 RÉVÉLER LA CARTE</button>
            <button class="secondary" onclick="nextCard()">📷 CARTE SUIVANTE</button>
        </section>

        <div id="youtubePlayer" class="audio-player"></div>

        <section id="revealScreen" class="screen">
            <div class="panel">
                <h2>🎉 RÉVÉLATION</h2>
                <div id="musicTitle" class="music-title"></div>
                <div id="gameTitle" class="game-title"></div>
                <div id="cardDate" class="card-date"></div>
                <div id="cardNumber" class="card-number"></div>
            </div>
            <button onclick="nextCard()">📷 CARTE SUIVANTE</button>
        </section>

        <section id="errorScreen" class="screen">
            <div class="panel">
                <h2>❌ ERREUR</h2>
                <p id="errorMessage"></p>
            </div>
            <button onclick="nextCard()">RETOUR</button>
        </section>
    </div>

let scanner = null;
let currentCard = null;

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById(id);
    if(target) target.classList.add("active");
}

async function startScanner() {
    document.getElementById("startPanel").style.display = "none";
    document.getElementById("scannerPanel").style.display = "block";
    
    if (typeof Html5Qrcode === 'undefined') {
        alert("La bibliothèque du scanner n'est pas chargée !");
        return;
    }

    scanner = new Html5Qrcode("reader");
    try {
        await scanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 240 }, 
            async (text) => {
                await stopScanner();
                processQR(text);
            }
        );
    } catch(e) {
        await stopScanner();
        document.getElementById("errorMessage").textContent = "Accès caméra refusé ou indisponible.";
        showScreen("errorScreen");
    }
}

async function stopScanner() {
    if(scanner) { 
        try { 
            await scanner.stop(); 
        } catch(e){} 
        scanner = null; 
    }
    document.getElementById("scannerPanel").style.display = "none";
}

async function cancelScanner() {
    await stopScanner();
    document.getElementById("startPanel").style.display = "block";
}

function processQR(text) {
    const match = String(text).match(/GEEKSTER[-_]?(\d{1,3})/i);
    if(!match) {
        document.getElementById("errorMessage").textContent = "Code QR non reconnu (" + text + ")";
        showScreen("errorScreen");
        return;
    }
    const number = match[1].padStart(3, "0");
    if(!cards[number]) {
        document.getElementById("errorMessage").textContent = "Carte inconnue : " + number;
        showScreen("errorScreen");
        return;
    }
    currentCard = { ...cards[number], number: number };
    document.getElementById("readyNumber").textContent = number;
    showScreen("readyScreen");
}

function playMusic() {
    if(!currentCard) return;
    const player = document.getElementById("youtubePlayer");
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${currentCard.youtube}?autoplay=1&enablejsapi=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    document.getElementById("playingNumber").textContent = currentCard.category;
    showScreen("playerScreen");
}

function revealCard() {
    if(!currentCard) return;
    document.getElementById("musicTitle").textContent = currentCard.music;
    document.getElementById("gameTitle").textContent = currentCard.game;
    document.getElementById("cardDate").textContent = "📅 " + currentCard.date;
    document.getElementById("cardNumber").textContent = currentCard.category;
    showScreen("revealScreen");
}

async function nextCard() {
    await stopScanner();
    currentCard = null;
    document.getElementById("youtubePlayer").innerHTML = "";
    document.getElementById("startPanel").style.display = "block";
    showScreen("home");
   }

        // Fonction pour basculer sur le mode Blind Test depuis le lecteur
function startBlindTestMode() {
    if(!currentCard) return;
    
    // On récupère le conteneur YouTube et on le déplace ou le réécrit sur l'écran BT
    const playerBT = document.getElementById("youtubePlayerBT");
    playerBT.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${currentCard.youtube}?autoplay=1&enablejsapi=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    
    document.getElementById("btPlayingNumber").textContent = "Blind Test - " + currentCard.category;
    document.getElementById("btClues").innerHTML = ""; // On remet les indices à zéro
    document.getElementById("btUserGuess").value = ""; // On vide le champ texte
    
    showScreen("blindTestScreen");
}

// Afficher la première lettre
function showBTLetter() {
    if(!currentCard) return;
    const firstLetter = currentCard.game.charAt(0).toUpperCase();
    document.getElementById("btClues").innerHTML += `<br>Indice 1ère lettre : <strong>${firstLetter}...</strong>`;
}

// Afficher la date
function showBTDate() {
    if(!currentCard) return;
    document.getElementById("btClues").innerHTML += `<br>Indice Année : <strong>${currentCard.date}</strong>`;
}

// Vérifier la réponse tapée par l'utilisateur
function checkBTGuess() {
    const userGuess = document.getElementById("btUserGuess").value.trim().toLowerCase();
    const correctGame = currentCard.game.trim().toLowerCase();

    if (userGuess === "") return;

    if (userGuess === correctGame) {
        let audio = new Audio('https://www.myinstants.com/media/sounds/tada_1.mp3');
        audio.play().catch(e => {});
        alert("🎉 Bravo, c'est gagné ! C'était bien : " + currentCard.game);
        revealCard(); // On bascule sur l'écran de révélation classique
    } else {
        let audio = new Audio('https://www.myinstants.com/media/sounds/bruh-sound-effect.mp3');
        audio.play().catch(e => {});
        alert("❌ Non, ce n'est pas ça ! Retentez.");
        document.getElementById("btUserGuess").value = "";
    }
}
